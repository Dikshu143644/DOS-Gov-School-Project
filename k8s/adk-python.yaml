apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adk-python
  template:
    metadata:
      labels:
        app: adk-python
    spec:
      containers:
      - name: adk-python
        image: pathraj/adk-python:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: adk-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: adk-service
spec:
  type: ClusterIP
  selector:
    app: adk-python
  ports:
  - port: 8000
    targetPort: 8000
