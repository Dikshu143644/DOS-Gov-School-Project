apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-web
  labels:
    app: school-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: school-web
  template:
    metadata:
      labels:
        app: school-web
    spec:
      containers:
      - name: nextjs-frontend
        image: pathraj/school-web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://api-service:4000"
---
apiVersion: v1
kind: Service
metadata:
  name: school-web-service
spec:
  type: ClusterIP
  selector:
    app: school-web
  ports:
  - port: 80
    targetPort: 3000
