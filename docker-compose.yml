services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathraj
      POSTGRES_PASSWORD: pathraj_dev_secret
      POSTGRES_DB: pathraj_school
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathraj"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pathraj_minio
      MINIO_ROOT_PASSWORD: pathraj_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://pathraj:pathraj_dev_secret@postgres:5432/pathraj_school
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_change_in_production
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  agents:
    build:
      context: ./services/agents
      dockerfile: Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      API_BASE_URL: http://api:4000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
